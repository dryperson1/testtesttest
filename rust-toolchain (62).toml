# The compiler this block's checked-in block.wasm was built with, the same as
# the editor's own sound blocks (blocks/src/rust-toolchain.toml in the
# editor's repository). Any recent Rust builds the block; this pin only
# makes a rebuild give exactly the same bytes.
#
# rustup treats "1.99.0" as a toolchain of its own, separate from "stable"
# even when stable is 1.99.0, and would download it if it is not installed.
# README.md says how to build with an installed compiler instead.
[toolchain]
channel = "1.99.0"
targets = ["wasm32v1-none"]
profile = "minimal"
